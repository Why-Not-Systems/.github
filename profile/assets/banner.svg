<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Why Not Systems: orquestrando agentes inteligentes">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 L0 0 0 32" fill="none" stroke="#1c2230" stroke-width="1"/>
    </pattern>
    <pattern id="avatar-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c2230" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="#0b0d12"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- logo -->
  <g transform="translate(64 40) scale(0.30)">
    <rect width="800" height="800" fill="#0b0d12"/>
    <rect width="800" height="800" fill="url(#avatar-grid)"/>
    <rect x="96" y="96" width="608" height="608" rx="54" fill="#10141c" stroke="#2a3140" stroke-width="6"/>

    <g fill="none" stroke="url(#brand)" stroke-width="12" stroke-linecap="round">
      <path d="M244 112H166Q112 112 112 166V244"/>
      <path d="M556 112H634Q688 112 688 166V244"/>
      <path d="M112 556V634Q112 688 166 688H244"/>
      <path d="M556 688H634Q688 688 688 634V556"/>
    </g>

    <g transform="translate(400 400) scale(1.25) translate(-400 -364)" fill="none" stroke="url(#brand)" stroke-width="12" stroke-linecap="round">
      <path d="M400 228L310 308M400 228L490 308M400 228V344M310 308L400 344M490 308L400 344M310 308L330 438M490 308L470 438M400 344L330 438M400 344L470 438M330 438L400 500M470 438L400 500"/>
    </g>

    <g transform="translate(400 400) scale(1.25) translate(-400 -364)" fill="#0b0d12" stroke="url(#brand)" stroke-width="12">
      <circle cx="400" cy="228" r="30"/>
      <circle cx="310" cy="308" r="28"/>
      <circle cx="490" cy="308" r="28"/>
      <circle cx="400" cy="344" r="32"/>
      <circle cx="330" cy="438" r="28"/>
      <circle cx="470" cy="438" r="28"/>
      <circle cx="400" cy="500" r="30"/>
    </g>
  </g>

  <!-- texto -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="330" y="150" fill="#e6e9ef" font-size="64" font-weight="700" letter-spacing="-1">Why Not Systems</text>
    <text x="332" y="198" fill="#8b93a7" font-size="26">Orquestrando agentes de IA autônomos</text>
    <text x="332" y="240" fill="#5eead4" font-size="18" font-family="'JetBrains Mono', Consolas, monospace">trigger → router → agents → deploy</text>
  </g>

  <!-- rede abstrata: dados e agentes fluem entre sistemas -->
  <g transform="translate(940 0)" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b93a7">
    <g stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1.5">
      <path d="M40 90 L150 70 M40 90 L150 160 M40 90 L150 250
               M40 160 L150 70 M40 160 L150 160 M40 160 L250 160 M40 160 L150 250
               M40 230 L150 70 M40 230 L150 160 M40 230 L150 250
               M150 70 L250 160 M150 160 L250 160 M150 250 L250 160"/>
    </g>
    <g fill="#5eead4"><circle cx="40" cy="90" r="7"/><circle cx="40" cy="160" r="7"/><circle cx="40" cy="230" r="7"/></g>
    <g fill="#818cf8"><circle cx="150" cy="70" r="7"/><circle cx="150" cy="160" r="7"/><circle cx="150" cy="250" r="7"/></g>
    <circle cx="250" cy="160" r="9" fill="#a78bfa"/>
  </g>
</svg>
